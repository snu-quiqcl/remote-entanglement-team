[client]
nickname = EC

[server]
win_server = Windows server that controls the devices shared by two setups.
rpi_ctrl = Raspberry pi server that controls the oven current and the mechanical beam shutter.
rpi_meas = Raspberry pi server that reads measurement devices.

[win_server]
ip = 172.22.22.34
port = 61599

[motor_server]
enabled = true
mode = standalone
ip = 172.22.22.34
port = 61600
protocol = 1
reconnect_interval_ms = 2000
max_frame_size = 1048576
token =
token_env = MOTOR_SERVER_EC_TOKEN

[rpi_ctrl]
ip = 127.0.0.2
port = 51235

[rpi_meas]
ip = 127.0.0.3
port = 51236

[gui]
theme = black
device = dds, wm, motors, rf, ccd

[device]
DDS = ClientController
motors = KDC101
RF = RF_Interface
wm = Client
ccd = Thorcam

[panels]
main_panel = main
measure_panel = measure
sequencer_panel = sequencer
runner_panel = runner

[applications]
data_analyzer = data_analyzer
pmt_aligner = pmt_aligner
pmt_aligner2 = pmt_aligner
pmt_aligner3 = pmt_aligner
pmt_aligner4 = pmt_aligner

[libraries]
mail_sender = mail_sender

[fpga]
serial_number = 210352B0BE81B
hardware_definition = HardwareDefinition_EC

[dds]
file = DDS_client_controller
class = DDS_ClientInterface
title = DDS
main_board_channel = 2
ch1_max_power = 550
ch2_max_power = 450


[ccd]
file = CCD_controller
class = CCD_Interface
title = CCD

[motors]
file = motor_controller_v4
class = MotorController
motor_type = KDC101
title = MOTORS
px_serno = 27001495
py_serno = 27500179
pz_serno = 27001486
sx_serno = 27250661
sy_serno = 27500322
sz_serno = 27002644
px_min = 0.0
px_max = 13.0
py_min = 0.0
py_max = 13.0
pz_min = 0.0
pz_max = 13.0
sx_min = 0.0
sx_max = 13.0
sy_min = 0.0
sy_max = 13.0
sz_min = 0.0
sz_max = 13.0
px_owner = EA
py_owner = EA
pz_owner = EA
sx_owner = EA
sy_owner = EA
sz_owner = EA

[wm]
file = wavemeter_controller
class = WaveMeterInterface
title = WM

[rf]
file = RF_client_controller_v2
class = RF_ClientInterface
title = RF

[main_panel]
file = main_panel
class = MainPanel

[measure_panel]
file = measure_panel
class = MeasurePanel
max_channel = 3
channel = 1, 3, 4

[sequencer_panel]
file = Sequencer_GUI
class = SequencerGUI

[runner_panel]
file = runner_panel
class = RunnerPanel

[data_analyzer]
file = Data_Analyzer
class = DataAnalyzer
title = Data_Analyzer

[pmt_aligner]
file = pmt_aligner_v3
class = PMTAlginerGUI
title = PMT_EC_collection
motors = px, py, pz
detector = PMT
color_map = inferno

[pmt_aligner2]
file = pmt_aligner_v3
class = PMTAlginerGUI
title = PMT_EC_excitation
motors = sx, sy, sz
detector = PMT2
color_map = bone

[pmt_aligner3]
file = pmt_aligner_v3
class = PMTAlginerGUI
title = PMT_EA_collection
remote = EA
motors = px, py, pz
detector = PMT3
color_map = viridis

[pmt_aligner4]
file = pmt_aligner_v3
class = PMTAlginerGUI
title = PMT_EA_excitation
remote = EA
motors = sx, sy, sz
detector = PMT4
color_map = afmhot

[mail_sender]
file = Mail_Sender
class = MailSender
